symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: dark-catppuccin
  light: light-github
setupVersion: 3
browser:
  enabled: false
defaultThinkingLevel: auto
task:
  enableEffort: false
  agentModelOverrides:
    sonic: "@execution_tier"
    tech-lead: "@doc_tier"
    software-engineer: "@execution_tier"
    code-reviewer: "@review_tier"
    qa-engineer: "@qa_tier"
    security-engineer: "@security_tier"
    security-audit-recon: "@review_tier"
    security-audit-hunter: "@security_tier"
    security-audit-verifier: "@security_tier"
    principal-engineer: "@doc_tier"
    pattern-reviewer: "@review_tier"
    performance-engineer: "@review_tier"
    summary-reviewer: "@summary_tier"
modelRoles:
  doc_tier: zai/glm-5.2:low
  human_tier: zai/glm-5.3-flash:low
  execution_tier: opencode-go/glm-5.3-flash:low
  review_tier: zai/glm-5.3-flash:low
  summary_tier: zai/glm-5.3:high
  qa_tier: opencode-go/glm-5.3-flash:low
  security_tier: zai/glm-5.2:low
  commit: openrouter/nvidia/nemotron-3.5-lightning:free
  default: zai/glm-5.3-flash:low
retry:
  modelFallback: true
  fallbackOn: any
  fallbackChains:
    default:
      - openrouter/nvidia/nemotron-3.5-lightning:free
      - opencode-go/glm-5.3:low
    doc_tier:
      - opencode-go/glm-5.3:medium
      - openrouter/nvidia/nemotron-3.5-lightning:free
    execution_tier:
      - openrouter/nvidia/nemotron-3.5-lightning:free
      - opencode-go/glm-5.3:low
    review_tier:
      - opencode-go/glm-5.3-flash:low
      - openrouter/nvidia/nemotron-3.5-lightning:free
    summary_tier:
      - zai/glm-5.2:medium
      - opencode-go/glm-5.3:medium
      - openrouter/nvidia/nemotron-3.5-lightning:free
    qa_tier:
      - openrouter/nvidia/nemotron-3.5-lightning:free
      - opencode-go/glm-5.3:low
    security_tier:
      - opencode-go/glm-5.3:medium
      - openrouter/nvidia/nemotron-3.5-lightning:free
    commit:
      - openrouter/thinkingmachines/inkling:free
compaction:
  thresholdTokens: 60000
find:
  enabled: "off"
dev:
  autoqaConsent: denied
  autoqa: false
security:
  enabled: true
providers:
  openai-codex:
    codeMode: "off"
telemetry:
  otlpExportEnabled: false
codexResets:
  autoRedeem5h: "yes"
  autoRedeemWeekly: "yes"
update:
  auto: true
hideThinkingBlock: true
statusLine:
  separator: ascii
  preset: ascii
terminal:
  showProgress: false
tui:
  textSizing: false