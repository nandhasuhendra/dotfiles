modelRoles:
  tiny: local/qwen3-1.7b:medium
  default: opencode-go/deepseek-v4.1-flash
# Fallback roles only; operator-selected session models are not pinned per agent.
symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: dark-dracula
  light: light-github
setupVersion: 2
browser:
  enabled: false
defaultThinkingLevel: low
# Prevent task callers from escalating child-agent reasoning effort implicitly.
task:
  enableEffort: false
dev:
  autoqaConsent: denied
  autoqa: false
security:
  enabled: true
providers:
  openai-codex:
    codeMode: "off"
telemetry:
  otlpExportEnabled: false