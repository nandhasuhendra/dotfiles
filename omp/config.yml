symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: light-github
  light: light-github
setupVersion: 2
browser:
  enabled: false
defaultThinkingLevel: auto
task:
  enableEffort: false
  agentModelOverrides:
    sonic: "@execution_tier"
    reviewer: "@review_tier"
    interviewer: "@doc_tier"
    security-reviewer: "@review_tier"
    tech-lead: "@doc_tier"
    qa-engineer: "@review_tier"
    product-manager: "@doc_tier"
    security-engineer: "@review_tier"
    software-engineer: "@execution_tier"
modelRoles:
  doc_tier: openai-codex/gpt-5.6-sol:low
  review_tier: openai-codex/gpt-5.6-sol:low
  execution_tier: opencode-zen/deepseek-v4.1-flash-free:low
  default: opencode-zen/big-pickle
retry:
  fallbackChains:
    doc_tier:
      - openai-codex/gpt-6.1-sol:low
      - google-antigravity/gemini-3.8-flash:low
      - opencode-zen/deepseek-v4.1-flash-free:low
      - openrouter/nvidia/nemotron-3.5-lightning:free:medium
    review_tier:
      - google-antigravity/gemini-3.8-flash:low
      - opencode-zen/deepseek-v4.1-flash-free:low
      - openrouter/nvidia/nemotron-3.5-lightning:free:medium
      - openrouter/thinkingmachines/inkling:free
    execution_tier:
      - opencode-zen/deepseek-v4.1-flash-free:low
      - google-antigravity/gemini-3.1-flash-lite:low
      - openrouter/nvidia/nemotron-3.5-lightning:free:medium
      - openrouter/thinkingmachines/inkling:free
compaction:
  thresholdTokens: 200000
  modelThresholds:
    opencode-zen/deepseek-v4.1-flash-free: 120000
    opencode-zen/glm-5.3-flash-free: 120000
    opencode-zen/mimo-v2.6-flash-free: 120000
    opencode-zen/big-pickle: 120000
find:
  enabled: "off"
dev:
  autoqaConsent: denied
  autoqa: false
security:
  enabled: true
providers:
  openai-codex:
    codeMode: "off"
telemetry:
  otlpExportEnabled: false