modelRoles:
  default: openrouter/minimax/minimax-m3.1-flash:free
# Fallback roles only; operator-selected session models are not pinned per agent.
symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: dark-dracula
  light: light-github
setupVersion: 2
browser:
  enabled: false
defaultThinkingLevel: low
# Prevent task callers from escalating child-agent reasoning effort implicitly.
task:
  enableEffort: false
dev:
  autoqaConsent: denied
  autoqa: false
security:
  enabled: true
providers:
  openai-codex:
    codeMode: "off"
telemetry:
  otlpExportEnabled: false
