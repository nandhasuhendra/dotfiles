symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: light-github
  light: light-github
setupVersion: 3
browser:
  enabled: false

# Cheap defaults; elevate only through explicit workload roles.
defaultThinkingLevel: low

task:
  enableEffort: false
  agentModelOverrides:
    sonic: "@execution_tier"
    reviewer: "@review_tier"
    interviewer: "@doc_tier"
    tech-lead: "@doc_tier"
    product-manager: "@doc_tier"
    software-engineer: "@execution_tier"
    code-reviewer: "@review_tier"
    qa-engineer: "@qa_tier"
    security-engineer: "@security_tier"

modelRoles:
  # Everyday conversation and lightweight orchestration.
  default: google-antigravity/gemini-3.8-flash:low

  # Planning/spec work: capable Flash first; Codex remains an explicit escalation.
  doc_tier: google-antigravity/gemini-3.8-flash:medium

  # Implementation and routine code changes.
  execution_tier: opencode-zen/deepseek-v4.1-flash-free:low

  # Diff review should be independent and inexpensive.
  review_tier: google-antigravity/gemini-3.8-flash:low

  # QA focuses on executing tests, not expensive reasoning.
  qa_tier: opencode-zen/deepseek-v4.1-flash-free:low

  # Reserve Codex quota for security-sensitive analysis.
  security_tier: openai-codex/gpt-5.6-sol:medium

retry:
  modelFallback: true
  fallbackOn: any
  rateLimitWalksChain: true
  fallbackChains:
    default:
      - opencode-zen/deepseek-v4.1-flash-free:low
      - openrouter/nvidia/nemotron-3.5-lightning:free:medium

    doc_tier:
      - opencode-zen/deepseek-v4.1-flash-free:low
      - openai-codex/gpt-5.6-sol:medium
      - openrouter/nvidia/nemotron-3.5-lightning:free:medium

    execution_tier:
      - google-antigravity/gemini-3.8-flash:low
      - openrouter/nvidia/nemotron-3.5-lightning:free:medium

    review_tier:
      - opencode-zen/deepseek-v4.1-flash-free:low
      - openrouter/nvidia/nemotron-3.5-lightning:free:medium

    qa_tier:
      - google-antigravity/gemini-3.8-flash:low
      - openrouter/nvidia/nemotron-3.5-lightning:free:medium

    security_tier:
      - google-antigravity/gemini-3.8-flash:medium
      - opencode-zen/deepseek-v4.1-flash-free:low
      - openrouter/nvidia/nemotron-3.5-lightning:free:medium

compaction:
  thresholdTokens: 60000
find:
  enabled: "off"
dev:
  autoqaConsent: denied
  autoqa: false
security:
  enabled: true
providers:
  openai-codex:
    codeMode: "off"
telemetry:
  otlpExportEnabled: false
codexResets:
  autoRedeem5h: "yes"
  autoRedeemWeekly: "yes"
update:
  auto: true
